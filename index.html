<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسلسلات تركية مدبلجة - 240p</title>
    <!-- استيراد FFmpeg.wasm من CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
        body { background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        h1 { text-align: center; color: #f5c518; }
        .series-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .series-card { background: #1e1e1e; border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .series-card:hover { border-color: #f5c518; transform: scale(1.02); }
        .series-card img { width: 100%; height: 280px; object-fit: cover; }
        .series-card h3 { padding: 10px; text-align: center; font-size: 16px; }
        .episodes-section { margin-top: 30px; background: #1e1e1e; padding: 20px; border-radius: 12px; display: none; }
        .episode-btn { display: inline-block; background: #333; padding: 10px 20px; margin: 5px; border-radius: 8px; cursor: pointer; transition: 0.3s; border: none; color: #fff; }
        .episode-btn:hover { background: #f5c518; color: #000; }
        .video-wrapper { margin-top: 30px; display: none; flex-direction: column; align-items: center; background: #000; padding: 20px; border-radius: 12px; }
        video { width: 100%; max-width: 640px; background: #000; border-radius: 8px; }
        #progress-container { width: 100%; max-width: 640px; margin: 15px 0; display: none; }
        #progress-bar { width: 100%; height: 20px; background: #333; border-radius: 10px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #f5c518, #ff9800); transition: width 0.2s; }
        #status-text { color: #aaa; font-size: 14px; margin-top: 5px; text-align: center; }
        .loading { text-align: center; padding: 50px; font-size: 20px; color: #f5c518; }
        .error-msg { color: #ff4444; background: #2a0000; padding: 10px; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 المسلسلات التركية المدبلجة (جودة 240p)</h1>
        <div id="series-list" class="series-grid"><div class="loading">⏳ جاري تحميل البيانات...</div></div>
        
        <div id="episodes-container" class="episodes-section">
            <h2 id="series-title" style="color:#f5c518;"></h2>
            <div id="episodes-list"></div>
        </div>

        <div id="video-wrapper" class="video-wrapper">
            <div id="progress-container">
                <div id="progress-bar"><div id="progress-fill"></div></div>
                <div id="status-text">⏳ جاري التهيئة...</div>
            </div>
            <video id="video-player" controls></video>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. تحميل بيانات المسلسلات (من data.json)
        // ==========================================
        let seriesData = [];
        const seriesListEl = document.getElementById('series-list');
        const episodesContainer = document.getElementById('episodes-container');
        const episodesListEl = document.getElementById('episodes-list');
        const seriesTitleEl = document.getElementById('series-title');
        const videoWrapper = document.getElementById('video-wrapper');
        const videoPlayer = document.getElementById('video-player');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');

        // تحميل البيانات
        async function loadSeries() {
            try {
                const res = await fetch('data.json');
                if (!res.ok) throw new Error('لا يوجد ملف بيانات، انتظر التحديث التلقائي.');
                seriesData = await res.json();
                renderSeries(seriesData);
            } catch (e) {
                seriesListEl.innerHTML = `<div class="error-msg">❌ ${e.message}. تأكد من تشغيل GitHub Action لجلب البيانات.</div>`;
            }
        }

        // ==========================================
        // 2. عرض المسلسلات
        // ==========================================
        function renderSeries(data) {
            if (!data || data.length === 0) {
                seriesListEl.innerHTML = '<div class="loading">📭 لا توجد مسلسلات حالياً</div>';
                return;
            }
            seriesListEl.innerHTML = data.map((series, idx) => `
                <div class="series-card" onclick="showEpisodes(${idx})">
                    <img src="${series.image || 'https://via.placeholder.com/200x280/333/f5c518?text=No+Image'}" alt="${series.name}" loading="lazy">
                    <h3>${series.name}</h3>
                </div>
            `).join('');
        }

        // ==========================================
        // 3. عرض الحلقات عند الضغط على مسلسل
        // ==========================================
        function showEpisodes(index) {
            const series = seriesData[index];
            if (!series) return;
            seriesTitleEl.textContent = `📺 ${series.name}`;
            episodesListEl.innerHTML = series.episodes.map((ep, i) => `
                <button class="episode-btn" onclick="playEpisode(${index}, ${i})">
                    ${ep.name || `الحلقة ${i+1}`}
                </button>
            `).join('');
            episodesContainer.style.display = 'block';
            videoWrapper.style.display = 'none';
            videoPlayer.pause();
            videoPlayer.src = '';
        }

        // ==========================================
        // 4. تشغيل الحلقة + ضغطها إلى 240p (باستخدام FFmpeg.wasm)
        // ==========================================
        let ffmpeg = null;
        let isProcessing = false;

        async function loadFFmpeg() {
            if (ffmpeg) return ffmpeg;
            try {
                statusText.innerText = '⏳ جاري تحميل محرك FFmpeg...';
                progressFill.style.width = '10%';
                const { FFmpeg } = window.FFmpegWASM;
                ffmpeg = new FFmpeg();
                
                // مراقبة التقدم أثناء التحويل
                ffmpeg.on('progress', ({ progress, time }) => {
                    const percent = Math.round(progress * 100);
                    progressFill.style.width = Math.min(percent, 99) + '%';
                    statusText.innerText = `🔄 جاري التحويل إلى 240p... ${percent}% (${Math.round(time/1000000)}s)`;
                });

                // تحميل Core (حوالي 30 ميجابايت - يتم تحميله مرة واحدة)
                await ffmpeg.load({
                    coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/ffmpeg-core.js',
                    wasmURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/ffmpeg-core.wasm',
                });
                statusText.innerText = '✅ محرك FFmpeg جاهز';
                progressFill.style.width = '20%';
                return ffmpeg;
            } catch (e) {
                console.error(e);
                statusText.innerText = `❌ فشل تحميل FFmpeg: ${e.message}`;
                throw e;
            }
        }

        async function playEpisode(seriesIdx, episodeIdx) {
            if (isProcessing) {
                alert('يتم معالجة حلقة أخرى حالياً، انتظر قليلاً.');
                return;
            }

            const series = seriesData[seriesIdx];
            const episode = series.episodes[episodeIdx];
            if (!episode || !episode.url) {
                alert('رابط الحلقة غير متوفر!');
                return;
            }

            // إظهار واجهة الفيديو وشريط التقدم
            videoWrapper.style.display = 'flex';
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            statusText.innerText = '⏳ جاري تحميل الفيديو من السيرفر...';
            videoPlayer.poster = series.image || '';
            isProcessing = true;

            try {
                // 4.1 تحميل الفيديو من السيرفر الأصلي (مع تجاوز CORS عبر Proxy)
                const videoUrl = episode.url;
                // نضيف Proxy لتجاوز مشاكل CORS (لأن المتصفح يمنع جلب الفيديو من مواقع أخرى)
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(videoUrl)}`;
                // ملاحظة: لو الموقع الأصلي يدعم CORS، استخدم videoUrl مباشرة.

                statusText.innerText = '⬇️ جاري تحميل الفيديو... (قد يطول حسب حجم الملف)';
                progressFill.style.width = '30%';

                const response = await fetch(proxyUrl, {
                    headers: { 'Origin': window.location.origin }
                });
                if (!response.ok) throw new Error(`فشل التحميل: ${response.status}`);
                
                const data = await response.arrayBuffer();
                const inputData = new Uint8Array(data);
                statusText.innerText = `📦 تم التحميل (${(inputData.length / 1024 / 1024).toFixed(2)} ميجابايت)، جاري الضغط...`;
                progressFill.style.width = '40%';

                // 4.2 تهيئة FFmpeg
                const ff = await loadFFmpeg();

                // كتابة الملف في الذاكرة الافتراضية لـ FFmpeg
                await ff.writeFile('input.mp4', inputData);

                // 4.3 أمر الضغط إلى 240p بجودة ممتازة (معدل بت ثابت + فلتر تحجيم)
                // -crf 28 يعطي جودة جيدة مع حجم صغير نسبياً في 240p
                statusText.innerText = '⚙️ بدء عملية الضغط (قد تستغرق عدة دقائق)...';
                progressFill.style.width = '50%';

                await ff.exec([
                    '-i', 'input.mp4',
                    '-vf', 'scale=426:240:flags=lanczos',  // دقة 240p مع فلتر تحسين الحدة
                    '-c:v', 'libx264',
                    '-crf', '28',           // توازن بين الجودة والحجم
                    '-preset', 'fast',      // تسريع المعالجة
                    '-c:a', 'aac',
                    '-b:a', '64k',          // صوت واضح في 240p
                    '-movflags', '+faststart',
                    'output.mp4'
                ]);

                // 4.4 قراءة الملف الناتج
                statusText.innerText = '📤 جاري تجهيز الفيديو المعالج...';
                progressFill.style.width = '90%';

                const outputData = await ff.readFile('output.mp4');
                const blob = new Blob([outputData.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);

                // 4.5 عرض الفيديو
                videoPlayer.src = url;
                videoPlayer.load();
                videoPlayer.play();

                statusText.innerText = '✅ تم الضغط بنجاح! جودة 240p جاهزة.';
                progressFill.style.width = '100%';

                // تنظيف الملفات من الذاكرة الافتراضية
                await ff.deleteFile('input.mp4');
                await ff.deleteFile('output.mp4');

            } catch (error) {
                console.error(error);
                statusText.innerText = `❌ خطأ: ${error.message}`;
                progressFill.style.width = '0%';
                alert('حدث خطأ أثناء المعالجة. تأكد من أن رابط الفيديو يعمل وحاول مجدداً.');
            } finally {
                isProcessing = false;
                // إخفاء شريط التقدم بعد 5 ثواني من الانتهاء أو الخطأ
                setTimeout(() => {
                    if (!isProcessing) {
                        // نتركه ظاهراً لكن نغير النص
                    }
                }, 5000);
            }
        }

        // ==========================================
        // 5. البدء عند تحميل الصفحة
        // ==========================================
        loadSeries();

        // إعادة تعيين شريط التقدم عند تغيير مصدر الفيديو (لحالات الإنهاء اليدوي)
        videoPlayer.addEventListener('pause', () => {
            if (videoPlayer.ended) {
                // الفيديو انتهى
            }
        });

        console.log('✅ سكربت المسلسلات التركية المدبلجة جاهز!');
    </script>
</body>
</html>
