<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل الفيديو — TelegramFlix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0b0f;
      color: #f5f5f7;
      font-family: "Cairo", "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      padding: 0.8rem 1.2rem;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo { font-weight: 800; color: #e50914; font-size: 1.2rem; }
    .status { font-size: 0.85rem; color: #9a9aa5; }
    .status.on { color: #34c759; }
    .status.err { color: #ff383c; }
    .player-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    video {
      width: 100%;
      max-width: 1200px;
      max-height: 80vh;
      background: #000;
      border-radius: 12px;
      display: none;
    }
    .loading {
      text-align: center;
      padding: 3rem;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(229,9,20,0.2);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: #9a9aa5; font-size: 1.05rem; }
    .progress {
      max-width: 400px;
      margin: 1rem auto 0;
      height: 6px;
      background: #1a1a20;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #e50914;
      width: 0;
      transition: width 0.3s;
    }
    .error {
      background: rgba(229,9,20,0.1);
      border: 1px solid #e50914;
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 500px;
      text-align: center;
    }
    .error h3 { color: #ff383c; margin-bottom: 0.8rem; }
    .error p { color: #9a9aa5; line-height: 1.7; }
    .error a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      background: #e50914;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">TelegramFlix</div>
    <div class="status" id="status">⏳ جاري الاتصال...</div>
  </header>

  <div class="player-wrap" id="wrap">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loadingText">جاري التحضير...</p>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    //  Player — auto-loads video from Telegram message URL
    // ═══════════════════════════════════════════════════════════
    (function () {
      const params = new URLSearchParams(window.location.search);
      const tgUrl = params.get("url");
      const statusEl = document.getElementById("status");
      const loadingEl = document.getElementById("loading");
      const loadingText = document.getElementById("loadingText");
      const progressBar = document.getElementById("progressBar");
      const wrap = document.getElementById("wrap");

      if (!tgUrl) {
        showError("لم يتم تحديد رابط الحلقة", "أضف ?url=... إلى الرابط");
        return;
      }

      // Parse t.me URL
      // https://t.me/shoofcima/880  OR  https://t.me/c/1234567890/880
      const m1 = tgUrl.match(/^https?:\/\/t\.me\/([^\/]+)\/(\d+)/);
      const m2 = tgUrl.match(/^https?:\/\/t\.me\/c\/(\d+)\/(\d+)/);
      if (!m1 && !m2) {
        showError("رابط تليجرام غير صالح", tgUrl);
        return;
      }

      const channel = m2 ? "-100" + m2[1] : m1[1];
      const messageId = m2 ? m2[2] : m1[2];

      statusEl.textContent = "🔍 جاري جلب المعلومات...";

      // Wait for the main app to initialize its global API
      // TG-WebApp-Proxy stores its client in `window.__tg_app__` or similar
      // We try to access it after a short delay.
      waitForApp(function (api) {
        if (!api) {
          showError(
            "لم يتم العثور على عميل تليجرام",
            "افتح الصفحة الرئيسية أولاً لتهيئة الجلسة، ثم أعد تحميل هذه الصفحة."
          );
          return;
        }

        statusEl.textContent = "📥 جاري تحميل الفيديو...";
        loadingText.textContent = "جاري تحميل الفيديو من تليجرام...";

        api.loadVideo(channel, messageId, {
          onProgress: function (percent) {
            progressBar.style.width = percent + "%";
            loadingText.textContent = "جاري التحميل... " + Math.round(percent) + "%";
          },
          onComplete: function (blobUrl) {
            showVideo(blobUrl);
          },
          onError: function (err) {
            showError("فشل تحميل الفيديو", String(err));
          }
        });
      });
    })();

    // ─── Try to find the exposed app API ───
    function waitForApp(callback, tries) {
      tries = tries || 0;
      const api = window.__tg_player_api__ || window.__tg_app__ || null;
      if (api && typeof api.loadVideo === "function") {
        callback(api);
        return;
      }
      if (tries > 50) {  // wait up to 5 seconds
        callback(null);
        return;
      }
      setTimeout(function () { waitForApp(callback, tries + 1); }, 100);
    }

    // ─── Display video ───
    function showVideo(url) {
      const video = document.createElement("video");
      video.src = url;
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;
      video.style.display = "block";
      video.setAttribute("preload", "auto");
      document.getElementById("wrap").innerHTML = "";
      document.getElementById("wrap").appendChild(video);
      document.getElementById("status").textContent = "▶ يعمل";
      document.getElementById("status").className = "status on";
    }

    // ─── Error display ───
    function showError(title, msg) {
      document.getElementById("status").textContent = "❌ خطأ";
      document.getElementById("status").className = "status err";
      document.getElementById("wrap").innerHTML =
        '<div class="error"><h3>' + title + '</h3><p>' + msg + '</p>' +
        '<a href="https://t.me/" target="_blank">فتح في تليجرام</a></div>';
    }
  </script>
</body>
</html>
