name: تحديث المسلسلات التركية

on:
  schedule:
    - cron: '0 6 * * *'   # يعمل يومياً الساعة 6 صباحاً بتوقيت UTC
  workflow_dispatch:      # يتيح لك التشغيل يدوياً من واجهة GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # للسماح بدفع التغييرات إلى المستودع
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: تثبيت الاعتماديات
        run: npm install axios cheerio

      - name: تشغيل سكربت الجلب
        run: node scraper.js

      - name: حفظ التغييرات في المستودع
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 تحديث تلقائي لقائمة المسلسلات"
          file_pattern: data.json
