name: 🤖 Auto Upload + Incremental Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      max_runtime_minutes:
        description: 'أقصى وقت (دقائق)'
        required: false
        default: '330'
        type: string
      force_full_build:
        description: 'إعادة بناء كل شيء'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-upload
  cancel-in-progress: false

jobs:
  upload-new-episodes:
    name: 📤 Upload New Episodes
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y google-chrome-stable || true
          sudo apt-get install -y chromium-chromedriver || true

      - name: Pre-install Python packages
        run: |
          pip install --upgrade pip
          pip install \
            "yt-dlp[default,curl-cffi]>=2026.08.19" \
            "seleniumbase>=4.52.0" \
            "beautifulsoup4>=4.13.0" \
            "curl_cffi>=0.15.0" \
            "pyrogram>=2.0.106" \
            "tgcrypto>=1.2.5"

      - name: Run auto uploader
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL: ${{ secrets.CHANNEL }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes || '330' }}
        run: python auto_uploader.py 2>&1 | tee upload_log.txt

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upload_state.json series_config.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "لا تغييرات"
          else
            git commit -m "🤖 update state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin main && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upload-log
          path: upload_log.txt
          retention-days: 7

  fetch-data:
    name: 📥 Fetch + Enrich
    runs-on: ubuntu-latest
    needs: upload-new-episodes
    if: always()
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: |
          pip install --upgrade pip
          pip install pyrogram==2.0.106 tgcrypto aiohttp requests

      - name: Fetch
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL: ${{ secrets.CHANNEL }}
          CHANNEL2: ${{ secrets.CHANNEL2 }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          STRING_SESSION2: ${{ secrets.STRING_SESSION2 }}
          HISTORY_LIMIT: '15000'
        run: python fetch_from_telegram.py

      - name: Enrich
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python enrich_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json forward_progress.json .poster_cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "لا تغييرات"
          else
            git commit -m "🤖 update data [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash --strategy-option=theirs origin main && git push origin main && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: data-json
          path: data.json
          retention-days: 7

  build:
    name: 🏗️ Incremental Build
    runs-on: ubuntu-latest
    needs: fetch-data
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: data-json
          path: .

      - name: Build (incremental)
        run: |
          if [ "${{ github.event.inputs.force_full_build }}" = "true" ]; then
            python build_all.py --force-full
          else
            python build_all.py
          fi

      - name: Show build stats
        run: |
          echo "docs size: $(du -sh docs/ | cut -f1)"
          echo "HTML files: $(find docs -name '*.html' | wc -l)"
          echo "Changed files: $(git status --porcelain docs/ | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - run: |
          echo "### ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
