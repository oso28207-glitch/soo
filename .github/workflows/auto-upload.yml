#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
auto_uploader.py — رافع المسلسلات التلقائي
★ يستدعي main.py عبر subprocess لرفع كل مسلسل بشكل منفصل
"""

import os
import sys
import json
import time
import subprocess
import re
from datetime import datetime
from pathlib import Path

ROOT = Path(__file__).resolve().parent
MAP_FILE = ROOT / "series_map.json"
STATE_FILE = ROOT / "upload_state.json"
MAIN_SCRIPT = ROOT / "main.py"

MAX_RUNTIME_SECONDS = int(os.environ.get("MAX_RUNTIME_MINUTES", "280")) * 60
MAX_EPISODES_PER_SEASON = 300
MAX_EPISODES_PER_RUN = 50  # حد main.py لكل تشغيل

SCRIPT_START = time.time()


def elapsed_str():
    e = int(time.time() - SCRIPT_START)
    return f"{e//3600}h{(e%3600)//60}m{e%60}s"


def remaining():
    return max(0, MAX_RUNTIME_SECONDS - (time.time() - SCRIPT_START))


def exceeded():
    return (time.time() - SCRIPT_START) >= MAX_RUNTIME_SECONDS


def load_json(path, default):
    if not path.exists():
        return default
    try:
        return json.loads(path.read_text(encoding="utf-8"))
    except Exception as e:
        print(f"⚠️ فشل قراءة {path.name}: {e}")
        return default


def save_json(path, data):
    try:
        path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
    except Exception as e:
        print(f"⚠️ فشل حفظ {path.name}: {e}")


def state_key(slug, season):
    return f"{slug}_s{season}"


def is_uploaded(state, slug, season, ep):
    return ep in state.get(state_key(slug, season), [])


def mark_uploaded(state, slug, season, eps_list):
    key = state_key(slug, season)
    if key not in state:
        state[key] = []
    for ep in eps_list:
        if ep not in state[key]:
            state[key].append(ep)
    state[key].sort()
    save_json(STATE_FILE, state)


def parse_main_log(log_text):
    """
    يحلّل مخرجات main.py لاستخراج:
    - عدد الحلقات المرفوعة
    - قائمة الحلقات المرفوعة (S01E05)
    """
    uploaded = []
    # ابحث عن "S01E05" أو "الحلقة 5" في السجل
    for m in re.finditer(r'✅\s+(?:S\d+E)?(\d+)', log_text):
        try:
            uploaded.append(int(m.group(1)))
        except:
            pass
    return uploaded


def extract_episode_from_caption(caption):
    """استخراج رقم الحلقة من الـ caption: "اسم الموسم 6 الحلقة 35" """
    m = re.search(r'الحلقة\s+(\d+)', caption)
    if m:
        return int(m.group(1))
    return None


def run_main_for_series(series_arabic, slug, season, start_ep, end_ep):
    """
    يستدعي main.py عبر subprocess لمجموعة حلقات.
    يعيد (success, log_text, uploaded_eps)
    """
    # اكتب series_config.json
    config = {
        "series_name": slug,
        "series_name_arabic": series_arabic,
        "season_num": season,
        "start_episode": start_ep,
        "end_episode": end_ep,
    }
    config_file = ROOT / "series_config.json"
    config_file.write_text(
        json.dumps(config, ensure_ascii=False, indent=2),
        encoding="utf-8",
    )

    print(f"\n{'='*60}")
    print(f"📺 {series_arabic} → {slug} | موسم {season} | حلقات {start_ep}-{end_ep}")
    print(f"{'='*60}", flush=True)

    # شغّل main.py
    env = os.environ.copy()
    env["INPUT_SERIES_NAME"] = slug
    env["INPUT_SERIES_NAME_ARABIC"] = series_arabic
    env["INPUT_SEASON_NUM"] = str(season)
    env["INPUT_START_EPISODE"] = str(start_ep)
    env["INPUT_END_EPISODE"] = str(end_ep)

    try:
        # حد الوقت الفعلي للحلقات
        timeout = max(120, min(remaining() - 60, 22 * 60 * (end_ep - start_ep + 1)))
        result = subprocess.run(
            [sys.executable, str(MAIN_SCRIPT)],
            cwd=str(ROOT),
            env=env,
            capture_output=True,
            text=True,
            timeout=timeout,
        )
        log_text = (result.stdout or "") + "\n" + (result.stderr or "")
        print(log_text)

        # استخرج الحلقات المرفوعة
        uploaded = []
        for ep in range(start_ep, end_ep + 1):
            # ابحث عن "✅ {ep}" في السجل
            if re.search(rf'✅\s+(?:S\d+E)?{ep:02d}\b', log_text) or \
               re.search(rf'✅\s+{ep}\s', log_text) or \
               f"الحلقة {ep}" in log_text and "✅" in log_text:
                uploaded.append(ep)

        # إذا لم نجد، نفترض أن كل الحلقات في النطاق نُفذت (قد تكون فشلت بعضها)
        # لكن main.py يطبع "✅ {ep}" عند النجاح
        # الأكثر دقة: افحص كل حلقة في النطاق
        if not uploaded and result.returncode == 0:
            # ابحث عن علامات الرفع الناجح
            pass

        return result.returncode == 0, log_text, uploaded

    except subprocess.TimeoutExpired:
        print(f"⏰ timeout على main.py")
        return False, "", []
    except Exception as e:
        print(f"❌ فشل تشغيل main.py: {e}")
        return False, "", []


def discover_last_uploaded_episode(series_arabic, slug, season, state):
    """
    يحاول معرفة آخر حلقة مرفوعة.
    - من state
    - أو من القناة (عبر fetch_from_telegram)
    """
    key = state_key(slug, season)
    existing = state.get(key, [])
    if existing:
        return max(existing)
    return 0


def find_gap_or_next(state, slug, season, max_ep=300):
    """
    يجد نطاق الحلقات التالي للرفع.
    - إذا كانت هناك حلقات مرفوعة، يبدأ من آخرها + 1
    - إذا لا، يبدأ من 1
    """
    last = discover_last_uploaded_episode(None, slug, season, state)
    start = last + 1
    end = min(start + MAX_EPISODES_PER_RUN - 1, max_ep)
    return start, end


def check_season_finished(state, slug, season, last_run_uploaded):
    """
    إذا لم تُرفع أي حلقة في آخر تشغيل، نفترض أن الموسم انتهى.
    """
    return len(last_run_uploaded) == 0


def main():
    print("=" * 60)
    print("🤖 Auto Uploader (subprocess mode)")
    print(f"⏱️ الحد: {MAX_RUNTIME_SECONDS // 60}m")
    print("=" * 60)

    # تحقق من وجود main.py
    if not MAIN_SCRIPT.exists():
        print(f"❌ {MAIN_SCRIPT.name} غير موجود")
        sys.exit(1)

    # تحميل البيانات
    series_map = load_json(MAP_FILE, {})
    state = load_json(STATE_FILE, {})

    # استخرج قائمة المسلسلات
    series_list = []
    for name, value in series_map.items():
        if name.startswith("_"):
            continue
        if isinstance(value, str):
            series_list.append((name, value, 1))
        elif isinstance(value, dict):
            slug = value.get("slug", "")
            season = int(value.get("season", 1))
            if slug:
                series_list.append((name, slug, season))

    print(f"\n📊 {len(series_list)} مسلسل للفحص")
    print(f"   state: {len(state)} مفتاح")

    # اطبع ملخص الحالة
    print("\n📋 الحالة الحالية:")
    for name, slug, season in series_list[:10]:
        key = state_key(slug, season)
        eps = state.get(key, [])
        if eps:
            print(f"   {name} S{season:02d}: {len(eps)} حلقة (آخر: {max(eps)})")
        else:
            print(f"   {name} S{season:02d}: لم يبدأ")
    if len(series_list) > 10:
        print(f"   ... و {len(series_list) - 10} مسلسل آخر")

    total_uploaded = 0

    for series_arabic, slug, season in series_list:
        if exceeded() or remaining() < 5 * 60:
            print(f"\n⏰ لا وقت كافٍ — إيقاف")
            break

        # احسب نطاق الحلقات
        start_ep, end_ep = find_gap_or_next(state, slug, season)

        # إذا كانت الحلقة الأكبر في state = 300، تخطى
        if start_ep > MAX_EPISODES_PER_SEASON:
            continue

        # شغّل main.py للنطاق
        success, log_text, uploaded = run_main_for_series(
            series_arabic, slug, season, start_ep, end_ep
        )

        if uploaded:
            mark_uploaded(state, slug, season, uploaded)
            total_uploaded += len(uploaded)
            print(f"\n✅ {series_arabic}: {len(uploaded)} حلقة مرفوعة")

        # إذا فشل تماماً (لا حلقات)، تخطى هذا المسلسل
        if not uploaded and start_ep > 1:
            # ربما الموسم انتهى
            print(f"ℹ️ {series_arabic} S{season:02d}: لا حلقات جديدة")

    print(f"\n{'='*60}")
    print(f"⏱️ {elapsed_str()}")
    print(f"✅ إجمالي المرفوع: {total_uploaded} حلقة")
    print(f"{'='*60}")


if __name__ == "__main__":
    main()
