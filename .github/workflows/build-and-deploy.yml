# ═══════════════════════════════════════════════════════════
#  🎬 TelegramFlix — Build & Deploy
# ═══════════════════════════════════════════════════════════
name: 🎬 Build & Deploy TelegramFlix

on:
  push:
    branches: [main]
    paths:
      - 'build_all.py'
      - 'data.json'
      - 'static/**'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 🔨 Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6          # تم التحديث

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7      # تم التحديث
        with:
          python-version: '3.11'

      - name: 🔨 Build the site
        run: python build_all.py --clean    # تمت إزالة --force
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: 📋 Show build output
        run: |
          echo "=== docs/ contents ==="
          ls -la docs/ || true
          echo ""
          echo "=== File count ==="
          find docs -type f | wc -l
          echo ""
          echo "=== Total size ==="
          du -sh docs/ || true

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v5   # تم التحديث
        with:
          path: docs/

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v5          # تم التحديث
