name: 🎬 Build & Deploy TelegramFlix

on:
  push:
    branches: [main]
    paths:
      - 'build_all.py'
      - 'data.json'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 🔨 Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔨 Build the site
        run: python build_all.py --clean
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: 🔎 Verify docs/ was created
        run: |
          echo "=== docs/ contents ==="
          ls -la docs/
          echo ""
          echo "=== Counting files ==="
          COUNT=$(find docs -type f | wc -l)
          echo "Total files: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "❌ ERROR: docs/ is empty! Build failed."
            exit 1
          fi
          if [ ! -f docs/index.html ]; then
            echo "❌ ERROR: docs/index.html missing!"
            exit 1
          fi
          echo "✅ docs/ looks good."
          du -sh docs/

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
