name: Build and Deploy TelegramFlix

on:
  schedule:
    # كل 6 ساعات
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'fetch_from_telegram.py'
      - 'enrich_data.py'
      - 'build_all.py'
      - 'clean_data.py'
      - 'classify.py'
      - '.github/workflows/build-and-deploy.yml'

# صلاحيات الكتابة للنشر
permissions:
  contents: write
  pages: write
  id-token: write

# تجنب تشغيل نسختين في نفس الوقت
concurrency:
  group: "build-and-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ═══════════════════════════════════════════════════════
      # 1) سحب الكود
      # ═══════════════════════════════════════════════════════
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ═══════════════════════════════════════════════════════
      # 2) تثبيت Python
      # ═══════════════════════════════════════════════════════
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ═══════════════════════════════════════════════════════
      # 3) تثبيت المتطلبات
      # ═══════════════════════════════════════════════════════
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyrogram tgcrypto requests

      # ═══════════════════════════════════════════════════════
      # 4) جلب البيانات من Telegram
      # ═══════════════════════════════════════════════════════
      - name: Fetch from Telegram
        if: ${{ secrets.API_ID != '' }}
        env:
          API_ID:           ${{ secrets.API_ID }}
          API_HASH:         ${{ secrets.API_HASH }}
          STRING_SESSION:   ${{ secrets.STRING_SESSION }}
          STRING_SESSION2:  ${{ secrets.STRING_SESSION2 }}
          CHANNEL:          ${{ secrets.CHANNEL }}
          CHANNEL2:         ${{ secrets.CHANNEL2 }}
          HISTORY_LIMIT:    '5000'
          MAX_FILE_MB:      '2000'
        run: python fetch_from_telegram.py
        continue-on-error: true

      # ═══════════════════════════════════════════════════════
      # 5) تنظيف وإعادة تصنيف data.json  ← خطوة جديدة
      # ═══════════════════════════════════════════════════════
      - name: Clean & Reclassify data
        run: |
          if [ -f data.json ]; then
            python clean_data.py
          else
            echo "data.json غير موجود — تخطي"
          fi

      # ═══════════════════════════════════════════════════════
      # 6) إثراء البيانات (البوسترات + metadata)
      # ═══════════════════════════════════════════════════════
      - name: Enrich data with posters
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python enrich_data.py
        continue-on-error: true

      # ═══════════════════════════════════════════════════════
      # 7) عرض إحصائيات سريعة
      # ═══════════════════════════════════════════════════════
      - name: Show statistics
        run: |
          python -c "
          import json
          from collections import Counter
          d = json.load(open('data.json', encoding='utf-8'))
          s = d.get('series', []) if isinstance(d, dict) else d
          t = Counter(x.get('type','?') for x in s)
          o = Counter(x.get('origin','?') for x in s)
          print(f'إجمالي الأعمال: {len(s)}')
          print(f'الأنواع: {dict(t)}')
          print(f'الأصول: {dict(o)}')
          "

      # ═══════════════════════════════════════════════════════
      # 8) بناء الموقع
      # ═══════════════════════════════════════════════════════
      - name: Build site
        run: python build_all.py --clean

      # ═══════════════════════════════════════════════════════
      # 9) حفظ التغييرات (data.json + docs/)
      # ═══════════════════════════════════════════════════════
      - name: Commit & Push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/ 2>/dev/null || true
          git add data.json 2>/dev/null || true
          git add forward_progress.json 2>/dev/null || true
          git add .poster_cache.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "لا توجد تغييرات — تخطي الـ commit"
          else
            git commit -m "🤖 Auto build: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:${{ github.ref_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ═══════════════════════════════════════════════════════
      # 10) رفع ملف docs للنشر على Pages
      # ═══════════════════════════════════════════════════════
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # ═══════════════════════════════════════════════════════════
  # مهمة النشر
  # ═══════════════════════════════════════════════════════════
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
