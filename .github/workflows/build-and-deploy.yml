name: 🎬 Build & Deploy TelegramFlix

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write        # مهم لحفظ forward_progress.json
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 🔨 Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyrogram>=2.0.106" "tgcrypto>=1.2.5" "aiohttp>=3.9"

      - name: 📥 Fetch from Telegram (rate-limited)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL: ${{ secrets.CHANNEL }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          STRING_SESSION2: ${{ secrets.STRING_SESSION2 }}
          STREAM_BASE: ${{ secrets.STREAM_BASE }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STORAGE_CHANNEL: ${{ secrets.STORAGE_CHANNEL }}
          HISTORY_LIMIT: '2000'
        run: python -u fetch_from_telegram.py

      - name: 💾 Commit progress (with retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forward_progress.json data.json || true
          git diff --staged --quiet || git commit -m "🤖 Update progress + data [skip ci]"
          # دمج التغييرات البعيدة قبل الرفع
          git pull --rebase origin main || true
          git push origin main || {
            echo "⚠️ push failed, retrying..."
            git pull --rebase origin main || true
            git push origin main || true
          }

      - name: 🔎 Verify data.json
        run: |
          echo "=== data.json ==="
          ls -la data.json
          python3 -c "
          import json
          d = json.load(open('data.json'))
          series = d.get('series', [])
          total = sum(sum(len(e) for e in s.get('seasons', {}).values()) for s in series)
          with_url = sum(
              1 for s in series
              for eps in s.get('seasons', {}).values()
              for e in eps
              if e.get('video_url')
          )
          print(f'Series: {len(series)}')
          print(f'Episodes: {total}')
          print(f'With video_url: {with_url}')
          "

      - name: 🔨 Build the site
        run: |
          set -e
          python -u build_all.py --clean
          [ -f docs/index.html ] || exit 1
          echo "✅ Build OK"
          # تحقق من أن الرابط الجديد موجود
          echo "=== Checking for correct PROXY_URL ==="
          grep -o "tg-webapp-proxy[^\"]*" docs/watch/*.html | head -1 || echo "❌ PROXY_URL not found!"

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
