# ═══════════════════════════════════════════════════════════════
# GitHub Actions Workflow — جلب البيانات وبناء الموقع ونشره
# يعمل:
#   1) عند كل push على main
#   2) كل 6 ساعات تلقائياً
#   3) يدوياً عبر Actions → Run workflow
# ═══════════════════════════════════════════════════════════════

name: 🤖 Build & Deploy TelegramFlix

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  schedule:
    # كل 6 ساعات (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      history_limit:
        description: 'حد الرسائل المسحوبة من Telegram'
        required: false
        default: '5000'
        type: string
      force_rebuild:
        description: 'إعادة بناء كامل بدون استئناف'
        required: false
        default: false
        type: boolean

# ─── الصلاحيات ───
permissions:
  contents: write     # لعمل commit لـ data.json
  pages: write        # للنشر على GitHub Pages
  id-token: write     # لـ OIDC

# ─── منع التشغيل المتوازي ───
concurrency:
  group: build-deploy
  cancel-in-progress: false

# ═══════════════════════════════════════════════════════════════
# JOBS
# ═══════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────
  # Job 1: جلب البيانات من Telegram
  # ───────────────────────────────────────────────────────────
  fetch-data:
    name: 📥 Fetch from Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyrogram tgcrypto aiohttp

      - name: 🔍 Check environment
        run: |
          echo "=== Environment Check ==="
          python --version
          pip list | grep -iE "pyrogram|tgcrypto|aiohttp" || true
          echo "CHANNEL=${{ secrets.CHANNEL }}"
          echo "HISTORY_LIMIT=${{ github.event.inputs.history_limit || '5000' }}"

      - name: 📥 Fetch from Telegram
        id: fetch
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL: ${{ secrets.CHANNEL }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          STRING_SESSION2: ${{ secrets.STRING_SESSION2 }}
          STORAGE_CHANNEL: ${{ secrets.STORAGE_CHANNEL }}
          STREAM_BASE: ${{ secrets.STREAM_BASE }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HISTORY_LIMIT: ${{ github.event.inputs.history_limit || '5000' }}
          MAX_FILE_MB: '2000'
        run: |
          python fetch_from_telegram.py
        continue-on-error: false

      - name: 📊 Verify data.json
        run: |
          echo "=== data.json ==="
          ls -lh data.json || echo "⚠️ data.json not found"
          if [ -f data.json ]; then
            python -c "
          import json
          with open('data.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          series = data.get('series', [])
          total_eps = sum(len(eps) for s in series for eps in s.get('seasons', {}).values())
          with_fid = sum(
              1 for s in series
              for eps in s.get('seasons', {}).values()
              for ep in eps
              if ep.get('file_id')
          )
          print(f'Series: {len(series)}')
          print(f'Episodes: {total_eps}')
          print(f'With file_id: {with_fid}')
          "
          fi

      - name: 💾 Commit data.json + forward_progress.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json forward_progress.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "🤖 Update data.json [skip ci]"
            git push origin main || {
              echo "⚠️ Push failed, retrying after pull..."
              git pull --rebase origin main
              git push origin main
            }
          fi

      - name: 📤 Upload data.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-json
          path: |
            data.json
            forward_progress.json
          retention-days: 7
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────
  # Job 2: بناء الموقع
  # ───────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build site
    runs-on: ubuntu-latest
    needs: fetch-data
    timeout-minutes: 15

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📥 Download data.json artifact
        uses: actions/download-artifact@v4
        with:
          name: data-json
          path: .

      - name: 📊 Verify data before build
        run: |
          echo "=== data.json ==="
          ls -lh data.json
          python -c "
          import json
          data = json.load(open('data.json', encoding='utf-8'))
          series = data.get('series', [])
          print(f'Series: {len(series)}')
          total = sum(len(eps) for s in series for eps in s.get('seasons', {}).values())
          print(f'Episodes: {total}')
          "

      - name: 🏗️ Build site
        run: |
          set -e
          python build_all.py --clean
          echo "✅ Build complete"

      - name: 📊 Build statistics
        run: |
          echo "=== Build output ==="
          echo "docs/ size: $(du -sh docs/ | cut -f1)"
          echo "HTML files: $(find docs -name '*.html' | wc -l)"
          echo "Watch pages: $(find docs/watch -name '*.html' 2>/dev/null | wc -l)"
          echo "Series pages: $(find docs/series -name '*.html' 2>/dev/null | wc -l)"
          echo ""
          echo "=== First 10 files ==="
          find docs -name '*.html' | head -10

      - name: 📤 Upload site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-docs
          path: docs/
          retention-days: 7

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  # ───────────────────────────────────────────────────────────
  # Job 3: النشر على GitHub Pages
  # ───────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Deployment summary
        run: |
          echo "### 🎉 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # ───────────────────────────────────────────────────────────
  # Job 4: إشعار بالفشل (اختياري)
  # ───────────────────────────────────────────────────────────
  notify-failure:
    name: ❌ Notify on failure
    runs-on: ubuntu-latest
    needs: [fetch-data, build, deploy]
    if: failure()
    steps:
      - name: ❌ Failure summary
        run: |
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "أحد الـ jobs فشل. تحقق من السجلات أعلاه." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
