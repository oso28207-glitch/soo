name: 🤖 Build & Deploy TelegramFlix

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', '.gitignore']
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  fetch-data:
    name: 📥 Fetch from Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: ${{ secrets.GITHUB_TOKEN }} }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }

      - name: 📚 Install dependencies
        run: |
          pip install pyrogram==2.0.106 tgcrypto aiohttp requests

      - name: 📥 Fetch from Telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL: ${{ secrets.CHANNEL }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          STORAGE_CHANNEL: ${{ secrets.STORAGE_CHANNEL }}
          STREAM_BASE: ${{ secrets.STREAM_BASE }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HISTORY_LIMIT: '5000'
        run: python fetch_from_telegram.py

      # ★★★ جلب صور المسلسلات من TMDB ★★★
      - name: 🖼️ Fetch posters from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python fetch_posters.py

      - name: 📊 Verify data.json
        run: |
          python -c "
          import json
          d = json.load(open('data.json', encoding='utf-8'))
          s = d.get('series', [])
          total = sum(len(eps) for x in s for eps in x.get('seasons', {}).values())
          with_poster = sum(1 for x in s if x.get('poster_url'))
          print(f'Series: {len(s)}')
          print(f'Episodes: {total}')
          print(f'With poster: {with_poster}')
          "

      - name: 💾 Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json forward_progress.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Update data + posters [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              sleep 3
            done
          fi

      - uses: actions/upload-artifact@v4
        with: { name: data-json, path: data.json, retention-days: 7 }

  build:
    name: 🏗️ Build site
    runs-on: ubuntu-latest
    needs: fetch-data
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/download-artifact@v4
        with: { name: data-json, path: . }
      - run: python build_all.py --clean
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/ }

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
