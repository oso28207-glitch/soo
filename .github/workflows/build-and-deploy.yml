name: Build and Deploy TelegramFlix

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.poster_cache.json'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      history_limit:
        description: 'حد الرسائل المسحوبة من Telegram'
        required: false
        default: '5000'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  fetch-data:
    name: Fetch from Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyrogram==2.0.106 tgcrypto aiohttp requests

      - name: Verify secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL: ${{ secrets.CHANNEL }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          missing=""
          [ -z "$API_ID" ] && missing="$missing API_ID"
          [ -z "$API_HASH" ] && missing="$missing API_HASH"
          [ -z "$CHANNEL" ] && missing="$missing CHANNEL"
          [ -z "$STRING_SESSION" ] && missing="$missing STRING_SESSION"
          [ -z "$TMDB_API_KEY" ] && missing="$missing TMDB_API_KEY"
          if [ -n "$missing" ]; then
            echo "Missing secrets:$missing"
            exit 1
          fi
          echo "All secrets present"

      - name: Fetch from Telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL: ${{ secrets.CHANNEL }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          STRING_SESSION2: ${{ secrets.STRING_SESSION2 }}
          STORAGE_CHANNEL: ${{ secrets.STORAGE_CHANNEL }}
          STREAM_BASE: ${{ secrets.STREAM_BASE }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HISTORY_LIMIT: ${{ github.event.inputs.history_limit || '5000' }}
          MAX_FILE_MB: '2000'
        run: python fetch_from_telegram.py

      - name: Enrich data (categories + posters)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python enrich_data.py

      - name: Verify data.json
        run: |
          python -c "
          import json
          from collections import Counter
          d = json.load(open('data.json', encoding='utf-8'))
          s = d.get('series', [])
          total = sum(len(eps) for x in s for eps in x.get('seasons', {}).values())
          types = Counter(x.get('type', '?') for x in s)
          origins = Counter(x.get('origin', '?') for x in s)
          with_poster = sum(
              1 for x in s
              if x.get('poster_url', '') and not x.get('poster_url', '').startswith('data:')
          )
          print(f'Series/Movies: {len(s)}')
          print(f'Episodes: {total}')
          print(f'Real posters: {with_poster}/{len(s)}')
          print(f'Types: {dict(types)}')
          print(f'Origins: {dict(origins)}')
          "

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json forward_progress.json .poster_cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data + cache [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Retry $i..."
              sleep 3
            done
          fi

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-json
          path: |
            data.json
            forward_progress.json
          retention-days: 7

  build:
    name: Build site
    runs-on: ubuntu-latest
    needs: fetch-data
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: data-json
          path: .

      - name: Verify data before build
        run: |
          ls -lh data.json
          python -c "
          import json
          d = json.load(open('data.json', encoding='utf-8'))
          s = d.get('series', [])
          print(f'Loaded {len(s)} items')
          "

      - name: Build site
        run: python build_all.py --clean

      - name: Build statistics
        run: |
          echo "docs size: $(du -sh docs/ | cut -f1)"
          echo "HTML files: $(find docs -name '*.html' | wc -l)"
          echo "Series pages: $(find docs/series -name '*.html' 2>/dev/null | wc -l)"
          echo "Watch pages: $(find docs/watch -name '*.html' 2>/dev/null | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "### Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [fetch-data, build, deploy]
    if: failure()
    steps:
      - name: Failure summary
        run: |
          echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One of the jobs failed. Check logs above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
