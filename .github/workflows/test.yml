name: Telegram Video Downloader

on:
  workflow_dispatch:
    inputs:
      series_name:
        description: 'اسم المسلسل بالإنجليزية (كما في رابط الموقع، مثال: muhtemel-ask)'
        required: true
        type: string
      series_name_arabic:
        description: 'اسم المسلسل بالعربية (للتسمية على تليغرام، مثال: احتمال حب)'
        required: true
        type: string
      season_num:
        description: 'رقم الموسم'
        required: true
        default: '1'
        type: string
      start_episode:
        description: 'رقم الحلقة الأولى'
        required: true
        default: '1'
        type: string
      end_episode:
        description: 'رقم الحلقة الأخيرة'
        required: true
        default: '1'
        type: string



permissions:
  contents: read

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome and chromedriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Verify Chrome and chromedriver
        run: |
          google-chrome --version
          chromedriver --version || true
          which chromedriver || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb fonts-liberation libnss3 libatk-bridge2.0-0 libgtk-3-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyrogram tgcrypto yt-dlp curl_cffi seleniumbase beautifulsoup4

      - name: Run downloader script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL: ${{ secrets.CHANNEL }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          # ✅ مدخلات workflow_dispatch
          INPUT_SERIES_NAME: ${{ github.event.inputs.series_name }}
          INPUT_SERIES_NAME_ARABIC: ${{ github.event.inputs.series_name_arabic }}
          INPUT_SEASON_NUM: ${{ github.event.inputs.season_num }}
          INPUT_START_EPISODE: ${{ github.event.inputs.start_episode }}
          INPUT_END_EPISODE: ${{ github.event.inputs.end_episode }}
        run: python main.py
