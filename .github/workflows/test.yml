name: test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ✅ الطريقة الصحيحة: إعداد Chrome + chromedriver بشكل متوافق
      - name: Setup Chrome and chromedriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Verify Chrome and chromedriver
        run: |
          google-chrome --version
          chromedriver --version || echo "chromedriver not in PATH, checking..."
          which chromedriver || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb fonts-liberation libnss3 libatk-bridge2.0-0 libgtk-3-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyrogram tgcrypto yt-dlp curl_cffi selenium seleniumbase beautifulsoup4

      - name: Run downloader script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL: ${{ secrets.CHANNEL }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
        run: python main.py
